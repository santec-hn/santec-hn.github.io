<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santi — Asistente de WhatsApp con IA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#0F766E;--brand2:#25D366;--bg:#F2F5F4;--ink:#10201E;--soft:#5A6B68;--line:#E0E7E5;--chat:#ECE5DD}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#D5DEDC;color:var(--ink);display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:430px;min-height:100vh;background:var(--bg);padding-bottom:84px;position:relative}
header{background:var(--brand);color:#fff;padding:22px 20px 24px;border-radius:0 0 26px 26px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px}.logo span{color:#A7F3D0}
.on-pill{font-size:12px;font-weight:600;background:rgba(167,243,208,.2);color:#A7F3D0;padding:5px 10px;border-radius:999px}
header h1{font-size:24px;margin-top:16px;font-family:'Space Grotesk',sans-serif}header p{opacity:.8;font-size:14px;margin-top:4px}
main{padding:18px 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}.stat b{font-family:'Space Grotesk',sans-serif;font-size:28px;display:block}.stat small{color:var(--soft);font-size:13px}
.stat.g{background:var(--brand);color:#fff}.stat.g small{color:#D1FAE5}
h2{font-size:17px;margin:20px 4px 10px}
.card{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--soft);font-size:13px;margin-top:4px}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:#D1FAE5;color:#065F46;white-space:nowrap}.chip.y{background:#FEF3C7;color:#92400E}
.av{width:42px;height:42px;border-radius:50%;background:#CCFBF1;display:grid;place-items:center;font-weight:700;color:var(--brand);flex:none}
.wa{display:flex;flex-direction:column;height:100vh;padding-bottom:70px}
.wahead{background:#075E54;color:#fff;padding:16px;display:flex;gap:12px;align-items:center}
.wahead .av{background:#fff}
.msgs{flex:1;overflow-y:auto;background:var(--chat);padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:9px 12px;border-radius:12px;font-size:14.5px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.1);white-space:pre-line}
.m.in{background:#fff;align-self:flex-start;border-top-left-radius:2px}.m.out{background:#DCF8C6;align-self:flex-end;border-top-right-radius:2px}
.m small{display:block;text-align:right;font-size:10.5px;color:#7a8a87;margin-top:3px}
.ai{font-size:10.5px;font-weight:700;color:var(--brand);display:block;margin-bottom:2px}
.typing{align-self:flex-start;background:#fff;padding:9px 14px;border-radius:12px;font-size:13px;color:var(--soft)}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--chat)}
.quick button{flex:none;background:#fff;border:1px solid #cfd8d6;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;color:#075E54;font-weight:600}
.composer{display:flex;gap:8px;padding:8px 10px;background:#F0F0F0}
.composer input{flex:1;border:none;border-radius:999px;padding:12px 16px;font:inherit}
.composer button{width:46px;height:46px;border-radius:50%;border:none;background:#075E54;color:#fff;font-size:18px;cursor:pointer}
nav{position:fixed;bottom:0;width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0 14px;z-index:5}
nav button{background:none;border:none;font:inherit;font-size:11px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}nav button.on{color:var(--brand);font-weight:700}nav svg{width:24px;height:24px}
label{display:block;font-size:13px;font-weight:600;color:var(--soft);margin:14px 2px 6px}
input.f,textarea{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
textarea{min-height:90px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.sw:last-child{border:none}
.tg{width:44px;height:26px;border-radius:999px;background:var(--brand2);position:relative;flex:none}.tg:after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;margin-top:16px;background:var(--brand);color:#fff}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;width:max-content;max-width:90%;z-index:9}.toast.on{opacity:1}
.shot .app,.shot nav{max-width:none}
</style>
</head>
<body>
<div class="app"><div id="view"></div><nav id="nav"></nav><div class="toast" id="toast"></div></div>
<script>
if(location.search.includes("shot"))document.documentElement.classList.add("shot");
const NEG="Repostería Dulce Hogar";
const CAT=[["Pastel de chocolate (12 porciones)",650],["Pastel tres leches (12 porciones)",600],["Cupcakes decorados (docena)",420],["Galletas de mantequilla (bolsa)",120]];
const ICON={chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 1.8 14H1.7a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 3.3 7.4a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 8.4 1.8V1.7a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.1a2 2 0 1 1 0 4z"/></svg>'};
const seed={msgs:[["in","¡Hola! 👋 Soy Santi, el asistente de "+NEG+". ¿En qué te ayudo? Puedo mostrarte el menú, tomar tu pedido o decirte el horario."]],ped:[
["Karla Pineda","Pastel tres leches + 1 docena de cupcakes","Sáb 8 nov · 2:00 p. m.","Confirmado"],["Luis Andino","Pastel de chocolate","Vie 7 nov · 10:00 a. m.","Confirmado"],["Daniela Cruz","Galletas de mantequilla (3 bolsas)","Hoy · 5:30 p. m.","Por confirmar"]],step:null,item:null};
let S;try{S=JSON.parse(localStorage.getItem("santi"))}catch(e){}if(!S)S=seed;
if(location.search.includes("demo"))S={...seed,msgs:[seed.msgs[0],["out","Hola, ¿tienen pastel tres leches para el sábado?"],["in","¡Hola! 😊 Sí, tenemos pastel tres leches de 12 porciones. ¿Quieres que te lo aparte para el sábado?"],["out","Sí, por favor. A nombre de Karla"],["in","¡Listo, Karla! ✅ Tu pedido quedó registrado:\n• Pastel tres leches (12 porciones)\n• Entrega: sábado 8 de noviembre\nTe escribimos un día antes para confirmar. 🎂"],["out","¡Gracias! 🙌"]]};
const save=()=>{try{localStorage.setItem("santi",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);const go=h=>location.hash=h;
function toast(t){$("toast").textContent=t;$("toast").classList.add("on");setTimeout(()=>$("toast").classList.remove("on"),2200)}
const hora=()=>{const d=new Date();return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")};
function brain(t){t=t.toLowerCase();
if(S.step=="nombre"){S.step="fecha";S.cli=t.replace(/\b\w/g,c=>c.toUpperCase());return "Gracias, "+S.cli+". ¿Para qué día y hora lo necesitas?"}
if(S.step=="fecha"){S.step=null;S.ped.unshift([S.cli,S.item,t,"Confirmado"]);save();return "¡Listo! ✅ Tu pedido quedó registrado:\n• "+S.item+"\n• Entrega: "+t+"\nTe escribimos un día antes para confirmar. ¡Gracias por tu compra! 🎂"}
const n=CAT.findIndex(c=>t.includes(c[0].split(" ")[1].toLowerCase())||t.includes(c[0].split(" ")[0].toLowerCase().slice(0,6)));
if(n>=0&&/(quiero|pedir|pedido|ordenar|encargar|me das|uno|una)/.test(t)||S.step=="item"&&n>=0){S.item=CAT[n][0];S.step="nombre";return "¡Excelente elección! 😋 "+CAT[n][0]+".\n¿A nombre de quién hago el pedido?"}
if(/(menu|menú|precio|cat[aá]logo|tienen|venden|que hay|qué hay)/.test(t))return "Este es nuestro menú 🍰\n"+CAT.map(c=>"• "+c[0]+" — L "+c[1]).join("\n")+"\n¿Cuál te gustaría pedir?";
if(/(pedido|pedir|ordenar|encargar|quiero)/.test(t)){S.step="item";return "¡Con gusto! ¿Qué te gustaría pedir? Tenemos pasteles, cupcakes y galletas."}
if(/(horario|hora|abren|cierran|abierto)/.test(t))return "Abrimos de lunes a sábado de 8:00 a. m. a 6:00 p. m. 🕗 Los pedidos por aquí los recibo las 24 horas.";
if(/(donde|dónde|ubicaci|direcci|entrega|domicilio)/.test(t))return "Estamos en Col. Las Minitas, Tegucigalpa 📍 y hacemos entregas a domicilio en toda la ciudad.";
if(/(hola|buenas|buenos)/.test(t))return "¡Hola! 😊 ¿Quieres ver el menú o hacer un pedido?";
if(/(gracias)/.test(t))return "¡A ti! Aquí estoy cuando me necesites. 💚";
return "Puedo ayudarte con el menú, pedidos, horario y entregas. Si prefieres, te comunico con una persona del equipo. 🙋"}
function send(txt){txt=(txt||$("inp").value).trim();if(!txt)return;S.msgs.push(["out",txt]);const r=brain(txt);save();render();
const box=$("msgs");box.insertAdjacentHTML("beforeend",'<div class="typing" id="typ">Santi está escribiendo…</div>');box.scrollTop=1e6;
setTimeout(()=>{S.msgs.push(["in",r]);save();render()},900)}
const V={
chat(){return `<div class="wa"><div class="wahead"><div class="av">🎂</div><div><b>${NEG}</b><div style="font-size:12px;opacity:.85">en línea · responde Santi (IA)</div></div></div>
<div class="msgs" id="msgs">${S.msgs.map(m=>`<div class="m ${m[0]}">${m[0]=="in"?'<span class="ai">Santi · IA</span>':""}${m[1]}<small>${m[0]=="out"?"✓✓ ":""}${hora()}</small></div>`).join("")}</div>
<div class="quick">${["Ver menú","Quiero un pastel tres leches","¿Cuál es el horario?","¿Hacen entregas?"].map(q=>`<button onclick="send('${q}')">${q}</button>`).join("")}</div>
<div class="composer"><input id="inp" placeholder="Escribe un mensaje" onkeydown="if(event.key=='Enter')send()"><button onclick="send()">➤</button></div></div>`},
panel(){return `<header><div class="top"><div class="logo">San<span>ti</span></div><span class="on-pill">● Activo 24/7</span></div><h1>Hoy en tu WhatsApp</h1><p>${NEG}</p></header><main>
<div class="grid"><div class="stat g"><b>47</b><small>Conversaciones atendidas</small></div><div class="stat"><b>3 s</b><small>Tiempo de respuesta</small></div>
<div class="stat"><b>${S.ped.length}</b><small>Pedidos tomados</small></div><div class="stat"><b>12</b><small>Mensajes fuera de horario</small></div></div>
<h2>Conversaciones recientes</h2>${[["Karla Pineda","Pedido confirmado para el sábado","hace 4 min"],["Luis Andino","Preguntó por precios de pasteles","hace 18 min"],["José Martínez","Pidió hablar con una persona","hace 35 min"]].map(c=>`<div class="card"><div class="row"><div style="display:flex;gap:12px;align-items:center"><div class="av">${c[0][0]}</div><div><b>${c[0]}</b><div class="muted">${c[1]}</div></div></div><small class="muted">${c[2]}</small></div></div>`).join("")}
<button class="btn" onclick="go('#chat')">Probar el asistente como cliente</button></main>`},
pedidos(){return `<header><div class="top"><div class="logo">San<span>ti</span></div><span class="on-pill">● Activo 24/7</span></div><h1>Pedidos</h1><p>Tomados automáticamente por WhatsApp</p></header><main>
${S.ped.map(p=>`<div class="card"><div class="row"><b>${p[0]}</b><span class="chip ${p[3]=="Confirmado"?"":"y"}">${p[3]}</span></div><div style="margin-top:8px">${p[1]}</div><div class="muted">📅 ${p[2]}</div></div>`).join("")}</main>`},
config(){return `<header><div class="top"><div class="logo">San<span>ti</span></div><span class="on-pill">● Activo 24/7</span></div><h1>Entrena a tu asistente</h1><p>Sin programar: escribe y listo</p></header><main>
<label>Nombre del negocio</label><input class="f" value="${NEG}">
<label>Productos y precios</label><textarea>${CAT.map(c=>c[0]+" — L "+c[1]).join("\n")}</textarea>
<label>Horario</label><input class="f" value="Lunes a sábado, 8:00 a. m. a 6:00 p. m.">
<h2>Qué puede hacer Santi</h2><div class="card">${["Responder preguntas frecuentes","Tomar pedidos","Agendar citas","Pasar la conversación a una persona","Enviar recordatorios"].map(x=>`<div class="sw">${x}<span class="tg"></span></div>`).join("")}</div>
<button class="btn" onclick="toast('Asistente actualizado')">Guardar cambios</button></main>`}};
function render(){const r=(location.hash.slice(1)||"panel");$("view").innerHTML=(V[r]||V.panel)();if(r!="chat")scrollTo(0,0);const b=$("msgs");if(b)b.scrollTop=1e6;
const t=[["panel","Resumen","home"],["chat","Chat","chat"],["pedidos","Pedidos","bag"],["config","Ajustes","gear"]];
$("nav").innerHTML=t.map(x=>`<button class="${x[0]==r?"on":""}" onclick="go('#${x[0]}')">${ICON[x[2]]}${x[1]}</button>`).join("")}
addEventListener("hashchange",render);render();
</script>
</body>
</html>
